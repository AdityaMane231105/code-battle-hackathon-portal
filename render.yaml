services:
  - type: web
    name: code-battle-portal
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python manage.py seed_demo --if-empty --open-demo-rounds && python manage.py bootstrap_admin && waitress-serve --listen=0.0.0.0:$PORT codebattle.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: 127.0.0.1,localhost
      - key: ADMIN_USERNAME
        value: organizer
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
